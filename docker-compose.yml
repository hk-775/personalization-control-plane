services:
  personalization-control-plane:
    build:
      context: .
    environment:
      PCP_HOST: 0.0.0.0
      PCP_PORT: 8102
      PCP_DB_PATH: /app/data/personalization-control-plane.db
      PCP_LOG_LEVEL: info
    ports:
      - "${PCP_BIND_ADDRESS:-127.0.0.1}:${PCP_PORT:-8102}:8102"
    volumes:
      - pcp-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/api/v1/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pcp-data:
