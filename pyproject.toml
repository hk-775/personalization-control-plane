[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personalization-control-plane"
version = "0.1.0"
description = "Governed experimentation and recommendation-optimization control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT-0"
license-files = ["LICENSE"]
authors = [{ name = "Personalization Control Plane Contributors" }]
keywords = [
    "recommendations",
    "experimentation",
    "personalization",
    "guardrails",
    "fairness",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2",
    "httpx2>=2,<3",
    "pip-audit>=2.9,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
]

[project.scripts]
pcp-demo = "personalization_control_plane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personalization_control_plane = [
    "py.typed",
    "web/*.html",
    "web/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.coverage.run]
source = ["personalization_control_plane"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
