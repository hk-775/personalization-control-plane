name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: pcp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install "uv==0.10.7"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run --frozen ruff check --no-cache src tests scripts

      - name: Test
        run: >-
          uv run --frozen pytest tests -q --tb=short
          --cov=personalization_control_plane
          --cov-branch
          --cov-report=term-missing

      - name: Validate package and static mirror
        run: uv run --frozen python scripts/validate_package.py

      - name: Smoke test standard port
        env:
          PCP_PORT: "8102"
        run: ./scripts/smoke.sh
